server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location ^~ /_next/ {
        try_files $uri =404;
    }

    location ^~ /error {
        try_files $uri $uri.html $uri/index.html /error/index.html /index.html =404;
    }

    location ~ ^/[^/]+/(.+)$ {
        set $subpath $1;
        if ($subpath ~* "^(.+)/$") {
            set $subpath $1;
        }
        
        try_files $uri $uri.html $uri/index.html /_/$subpath.html /_/$subpath/index.html /_/index.html /index.html;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /_/index.html /index.html;
    }

    error_page 403 /error/403/index.html;
    error_page 404 /error/404/index.html;
    error_page 500 /error/500/index.html;
    error_page 503 /error/503/index.html;
}

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
markers = ["integration: tests that require Docker"]
addopts = "--cov=autojudge --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["autojudge"]
omit = [
    "autojudge/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
skip_empty = false

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: tests that require Docker"]
addopts = "--cov=autojudge --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["autojudge"]
omit = [
    "autojudge/__main__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
skip_empty = false
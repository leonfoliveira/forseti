name: Regression Test - Branch

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 9 AM UTC

permissions:
  contents: read

jobs:
  regression-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build test composition
        run: |
          docker compose -f infrastructure/dev/docker-compose.yaml --profile infra --profile core --profile autojudge --profile webapp build --progress=plain --pull
          cd applications/autojudge/image
          docker buildx build -t forseti-sb-base:latest -f base.Dockerfile .
          docker buildx build -t forseti-sb-python312:latest -f python312.Dockerfile .

      - name: Start test composition
        run: |
          docker compose -f infrastructure/dev/docker-compose.yaml --profile infra --profile core --profile autojudge --profile webapp up -d --wait

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: test/regression/package.json

      - name: Install regression test dependencies
        run: |
          cd test/regression
          npm ci

      - name: Install Playwright browsers
        run: |
          cd test/regression
          npx playwright install --with-deps

      - name: Run regression tests
        run: |
          cd test/regression
          npm run test

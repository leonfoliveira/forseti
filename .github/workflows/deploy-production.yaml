      # - name: Deploy CloudFormation Stack
      #   uses: aws-actions/aws-cloudformation-github-deploy@v2
      #   with:
      #     name: prod-forseti-stack
      #     template: applications/template/dist/template.yaml
      #     parameter-overrides: ENV=production,Version=${{ steps.vars.outputs.tag }}
      #     no-fail-on-empty-changeset: true
      #     capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
      
      # - name: Upload webapp artifact
      #   run: |
      #     aws s3 sync applications/webapp/dist/ s3://${{ secrets.AWS_S3_PRODUCTION_WEBAPP_BUCKET }} --delete

      - name: Install MkDocs and dependencies
        run: pip install mkdocs mkdocs-material

      - name: Build MkDocs site
        working-directory: documentation
        run: VERSION=${{ steps.vars.outputs.tag }} mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/site

  deploy-pages:
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy Production

on:
  # Automatic deployment is disabled
  # release:
  #   types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  check-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check regression test status
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = context.ref.replace('refs/tags/', '');

            const tagResponse = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`
            });
            const commitSha = tagResponse.data.object.sha;

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'regression-test-branch.yaml',
              head_sha: commitSha,
              status: 'completed'
            });

            const successfulRuns = runsResponse.data.workflow_runs.filter(
              run => run.conclusion === 'success'
            );

            if (successfulRuns.length === 0) {
              const mainBranchRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'regression-test-branch.yaml',
                branch: 'main',
                status: 'completed',
                per_page: 10
              });
              
              const recentSuccessfulRun = mainBranchRuns.data.workflow_runs.find(
                run => run.conclusion === 'success'
              );
              
              if (!recentSuccessfulRun) {
                throw new Error('No successful regression test runs found for this release. Please ensure regression tests have passed before creating a release.');
              }
              
              console.log(`Found successful regression test run on main branch: ${recentSuccessfulRun.html_url}`);
            } else {
              console.log(`Found successful regression test run for commit ${commitSha}: ${successfulRuns[0].html_url}`);
            }

  build-and-deploy:
    needs: check-regression-tests
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get tag name
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set version environment variable
        run: echo "VERSION=${{ steps.vars.outputs.tag }}" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: applications/webapp/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for app in core autojudge; do
            docker build -t "$REGISTRY/forseti/$app:$VERSION" "applications/$app"
            docker push "$REGISTRY/forseti/$app:$VERSION"
          done

      # Mode is not passed, so the idle/contest mode of the running stacks is preserved.
      - name: Deploy stacks
        run: infrastructure/production/deploy.sh production --version "$VERSION" --yes

      - name: Read stack outputs
        id: outputs
        run: |
          set -euo pipefail
          source "infrastructure/production/environments/production.env"
          stack="production-forseti-webapp"
          output() {
            aws cloudformation describe-stacks --region "$REGION" --stack-name "$stack" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          echo "api_domain=api.$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "bucket=$(output WebAppBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(output WebAppDistributionId)" >> "$GITHUB_OUTPUT"
          echo "rum_app_id=$(output CloudWatchRumAppId)" >> "$GITHUB_OUTPUT"

      - name: Build webapp
        working-directory: applications/webapp
        env:
          VITE_VERSION: ${{ env.VERSION }}
          VITE_API_URL: https://${{ steps.outputs.outputs.api_domain }}
          VITE_CLOUDWATCH_RUM_APP_ID: ${{ steps.outputs.outputs.rum_app_id }}
          VITE_CLOUDWATCH_RUM_REGION: us-east-2
        run: npm ci && npm run build

      - name: Upload webapp
        env:
          BUCKET: ${{ steps.outputs.outputs.bucket }}
          DISTRIBUTION: ${{ steps.outputs.outputs.distribution }}
        run: |
          dist=applications/webapp/dist
          aws s3 sync "$dist/" "s3://$BUCKET" --delete --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "$dist/index.html" "s3://$BUCKET/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths "/index.html" "/config.js"

      - name: Install MkDocs and dependencies
        run: pip install mkdocs mkdocs-material

      - name: Build MkDocs site
        working-directory: documentation
        run: VERSION=${{ steps.vars.outputs.tag }} mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: documentation/site

  deploy-pages:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Build and Deploy Production

on:
  release:
    types: [created]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  check-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check regression test status
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const tagName = context.ref.replace('refs/tags/', '');

            const tagResponse = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${tagName}`
            });
            const commitSha = tagResponse.data.object.sha;

            const runsResponse = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'regression-test-branch.yaml',
              head_sha: commitSha,
              status: 'completed'
            });

            const successfulRuns = runsResponse.data.workflow_runs.filter(
              run => run.conclusion === 'success'
            );

            if (successfulRuns.length === 0) {
              const mainBranchRuns = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'regression-test-branch.yaml',
                branch: 'main',
                status: 'completed',
                per_page: 10
              });
              
              const recentSuccessfulRun = mainBranchRuns.data.workflow_runs.find(
                run => run.conclusion === 'success'
              );
              
              if (!recentSuccessfulRun) {
                throw new Error('No successful regression test runs found for this release. Please ensure regression tests have passed before creating a release.');
              }
              
              console.log(`Found successful regression test run on main branch: ${recentSuccessfulRun.html_url}`);
            } else {
              console.log(`Found successful regression test run for commit ${commitSha}: ${successfulRuns[0].html_url}`);
            }

  build-and-deploy:
    needs: check-regression-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get tag name
        id: vars
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set version environment variable
        run: echo "VERSION=${{ steps.vars.outputs.tag }}" >> $GITHUB_ENV

      # - name: Set up Python
      #   uses: actions/setup-python@v5

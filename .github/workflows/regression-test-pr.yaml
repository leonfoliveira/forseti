
name: Regression Test - PR

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  authorize:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/regression')

    runs-on: ubuntu-latest

    outputs:
      sha: ${{ steps.pr.outputs.sha }}
      repo: ${{ steps.pr.outputs.repo }}

    steps:
      - name: Check if comment author has write access
        uses: actions/github-script@v8
        with:
          script: |
            const { data: collaborator } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: context.payload.comment.user.login
              });

            const hasWriteAccess = ['admin', 'write'].includes(
              collaborator.permission
            );

            if (!hasWriteAccess) {
              core.setFailed(
                'Only collaborators with write access can trigger regression tests'
              );
            }

      - name: React to comment with thumbs up
        uses: actions/github-script@v8
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Get PR details
        id: pr
        uses: actions/github-script@v8
        with:
          script: |
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('repo', pullRequest.head.repo.full_name);

  regression-test:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read

    env:
      COMPOSE_FILE: infrastructure/development/docker-compose.yaml
      COMPOSE_PROFILES: infra,core,autojudge,webapp
      CI: true

    steps:
      - name: Checkout PR code
        uses: actions/checkout@v5
        with:
          repository: ${{ needs.authorize.outputs.repo }}
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Docker environment information
        run: |
          docker version
          docker compose version
          docker buildx version
          docker info

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build application composition
        run: |
          docker compose build --progress=plain --pull

      - name: Build sandbox images
        working-directory: applications/autojudge/sandboxes
        run: |
          docker buildx build --load \
            -t forseti-sb-base:latest \
            -f base.Dockerfile .

          docker buildx build --load \
            -t forseti-sb-python312:latest \
            -f python312.Dockerfile .

      - name: Start test composition
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps -a

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: test/regression/package-lock.json

      - name: Install regression test dependencies
        working-directory: test/regression
        run: npm ci

      - name: Install Playwright browsers
        working-directory: test/regression
        run: npx playwright install --with-deps

      - name: Run regression tests
        working-directory: test/regression
        run: npm run test

      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p artifacts/diagnostics

          docker compose ps -a \
            > artifacts/diagnostics/compose-ps.txt 2>&1 || true

          docker compose logs \
            --no-color \
            --timestamps \
            > artifacts/diagnostics/compose-logs.txt 2>&1 || true

          docker system df \
            > artifacts/diagnostics/docker-disk-usage.txt 2>&1 || true

          container_ids="$(docker compose ps -aq)"

          if [ -n "$container_ids" ]; then
            docker inspect $container_ids \
              > artifacts/diagnostics/container-inspect.json 2>&1 || true
          fi

          for service in $(docker compose config --services); do
            mkdir -p "artifacts/diagnostics/$service"

            docker compose logs \
              --no-color \
              --timestamps \
              "$service" \
              > "artifacts/diagnostics/$service/logs.txt" 2>&1 || true

            docker compose ps -a "$service" \
              > "artifacts/diagnostics/$service/status.txt" 2>&1 || true
          done

      - name: Upload regression test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test/regression/test-results/
            test/regression/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop test composition
        if: always()
        run: docker compose down --volumes --remove-orphans

  report:
    needs:
      - authorize
      - regression-test

    if: always() && needs.authorize.result == 'success'

    runs-on: ubuntu-latest

    permissions:
      issues: write

    steps:
      - name: Comment on PR with results
        uses: actions/github-script@v8
        with:
          script: |
            const result = '${{ needs.regression-test.result }}';

            const messages = {
              success: '✅ Regression tests passed!',
              failure: '❌ Regression tests failed.',
              cancelled: '⚠️ Regression tests were cancelled.',
              skipped: '⚠️ Regression tests were skipped.'
            };

            const artifactName =
              `regression-test-${context.runId}-${context.runAttempt}`;

            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;

            const commentBody = [
              messages[result] ?? `⚠️ Regression tests finished with status: ${result}.`,
              '',
              `**Commit:** \`${'${{ needs.authorize.outputs.sha }}'}\``,
              `**Workflow:** [View execution and diagnostic artifacts](${runUrl})`,
              `**Artifact:** \`${artifactName}\``
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

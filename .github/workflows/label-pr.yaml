name: Label PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes in folders
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            deployments:
              - 'deployments/**'
            core:
              - 'applications/core/**'
            webapp:
              - 'applications/webapp/**'
            autojudge:
              - 'applications/autojudge/**'
            docs:
              - 'docs/**'
            test:
              - 'test/**'

      - name: Add deployments label
        if: steps.changes.outputs.deployments == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['deployments']
            })

      - name: Add core label
        if: steps.changes.outputs.core == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['core']
            })

      - name: Add webapp label
        if: steps.changes.outputs.webapp == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['webapp']
            })

      - name: Add autojudge label
        if: steps.changes.outputs.autojudge == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['autojudge']
            })

      - name: Add documentation label
        if: steps.changes.outputs.docs == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['documentation']
            })

      - name: Add test label
        if: steps.changes.outputs.test == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['test']
            })

[versions]
bcrypt = "0.10.2"
flyway = "9.22.3"
hibernateEnvers = "7.4.10.Final"
hibernateTypes = "2.21.1"
jacksonDatatypeJsr310 = "3.0.0-rc2"
jacksonModuleKotlin = "3.2.3"
kotest = "6.2.5"
kotestExtensionsSpring = "1.3.0"
kotlin = "2.4.20"
kover = "0.9.1"
ktlint = "14.0.1"
kotlinxDatetime = "0.8.0"
kotlinxSerializationJson = "1.11.0"
kotlinxCoroutines = "1.10.2"
mockk = "1.14.11"
nettySocketio = "2.0.14"
opencsv = "5.12.0"
postgresql = "42.7.13"
snakeyaml = "2.7"
springBoot = "4.1.1"
springmockk = "5.0.1"
testcontainers = "1.21.4"
uuidCreator = "6.1.1"

[libraries]
bcrypt = { module = "at.favre.lib:bcrypt", version.ref = "bcrypt" }
flyway = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
hibernateEnvers = { module = "org.hibernate.orm:hibernate-envers", version.ref = "hibernateEnvers" }
hibernateTypes = { module = "com.vladmihalcea:hibernate-types-60", version.ref = "hibernateTypes" }
jacksonDatatypeJsr310 = { module = 'tools.jackson.datatype:jackson-datatype-jsr310', version.ref = "jacksonDatatypeJsr310" }
jacksonModuleKotlin = { module = 'com.fasterxml.jackson.module:jackson-module-kotlin', version.ref = "jacksonModuleKotlin" }
kotestAssertionsCore = { module = 'io.kotest:kotest-assertions-core', version.ref = "kotest" }
kotestRunnerJunit5 = { module = 'io.kotest:kotest-runner-junit5', version.ref = "kotest" }
kotestExtensionsSpring = { module = 'io.kotest.extensions:kotest-extensions-spring', version.ref = "kotestExtensionsSpring" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlinReflect = { module = 'org.jetbrains.kotlin:kotlin-reflect', version.ref = "kotlin" }
kotlinxDatetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinxDatetime" }
kotlinxSerialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
kotlinxCoroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
nettySocketio = { module = "com.corundumstudio.socketio:netty-socketio", version.ref = "nettySocketio" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
snakeyaml = { module = "org.yaml:snakeyaml", version.ref = "snakeyaml" }
springBootDevTools = { module = "org.springframework.boot:spring-boot-devtools", version.ref = "springBoot" }
springBootStarter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "springBoot" }
springBootStarterActuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "springBoot" }
springBootStarterDataJpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "springBoot" }
springBootStarterTest = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "springBoot" }
springBootStarterValidation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "springBoot" }
springBootStarterWeb = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "springBoot" }
springBootStarterWebsocket = { module = "org.springframework.boot:spring-boot-starter-websocket", version.ref = "springBoot" }
springBootTestcontainers = { module = "org.springframework.boot:spring-boot-testcontainers", version.ref = "springBoot" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springmockk" }
testcontainersJunitJupiter = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
uuidCreator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuidCreator" }

[plugins]
flyway = { id = "org.flywaydb.flyway", version.ref = "flyway" }
kotlinJpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlinSpring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
spring = { id = "org.springframework.boot", version.ref = "springBoot" }

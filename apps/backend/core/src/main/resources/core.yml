spring:
  application:
    version: ${VERSION:latest}
  jpa:
    show-sql: false
    properties:
      hibernate:
        ddl-auto: validate
        jdbc:
          time_zone: UTC
      org:
        hibernate:
          envers:
            do_not_audit_optimistic_locking_field: false
management:
  endpoints:
    web:
      exposure:
        include: health
AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Forseti secrets. Generated credentials for the database, the cache, the root user and the CloudFront-to-ALB
  origin check. Kept in their own long-lived stack so that rebuilding an application stack never regenerates them.

Parameters:
  Env:
    Type: String
    Description: Environment name
    AllowedValues:
      - production
      - staging

  RootPasswordSecretName:
    Type: String
    Description: >-
      Name of the secret holding the root user password. Core looks it up by this exact name ("root_password" is
      hard-coded in SignInService), so staging and production can only coexist in the same account and region
      if Core is changed to read the name from configuration.
    Default: root_password

Resources:
  # The database password is generated here instead of using an RDS-managed master secret: RDS rotates managed
  # secrets every 7 days, while the Core containers only read the password when they start, so every rotation
  # would break their connection pools in the middle of a contest.
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${Env} Forseti PostgreSQL credentials (username and password keys)"
      GenerateSecretString:
        SecretStringTemplate: '{"username": "forseti"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Plain string: used as the ElastiCache AUTH token and injected as REDIS_PASSWORD
  CacheAuthSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${Env} Forseti ElastiCache AUTH token"
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # Plain string: Core compares the password typed by the root user with the raw secret value
  RootPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Ref RootPasswordSecretName
      Description: !Sub "${Env} Forseti root user password"
      GenerateSecretString:
        PasswordLength: 24
        ExcludePunctuation: true

  # Plain string: sent by CloudFront as X-Origin-Verify and required by the ALB listener rule
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: !Sub "${Env} Forseti shared secret between CloudFront and the Core ALB"
      GenerateSecretString:
        PasswordLength: 40
        ExcludePunctuation: true

Outputs:
  DatabaseSecretArn:
    Description: ARN of the database credentials secret
    Value: !Ref DatabaseSecret
    Export:
      Name: !Sub "${Env}-secrets-DatabaseSecretArn"

  CacheAuthSecretArn:
    Description: ARN of the cache AUTH token secret
    Value: !Ref CacheAuthSecret
    Export:
      Name: !Sub "${Env}-secrets-CacheAuthSecretArn"

  RootPasswordSecretArn:
    Description: ARN of the root user password secret
    Value: !Ref RootPasswordSecret
    Export:
      Name: !Sub "${Env}-secrets-RootPasswordSecretArn"

  OriginVerifySecretArn:
    Description: ARN of the CloudFront origin verification secret
    Value: !Ref OriginVerifySecret
    Export:
      Name: !Sub "${Env}-secrets-OriginVerifySecretArn"

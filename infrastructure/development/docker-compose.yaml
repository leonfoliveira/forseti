name: forseti-development
services:
  floci:
    container_name: dev-forseti-floci
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_SERVICES_DOCKER_NETWORK: dev-forseti-network
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
    image: floci/floci:2.4.0
    networks:
      - dev-forseti-network
    ports:
      - 4566:4566
      - 6379-6399:6379-6399
      - 7001-7099:7001-7099
    profiles:
      - infra
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./volumes/floci/init:/etc/floci/init:ro
      - dev-floci_data:/app/data

  migration:
    container_name: dev-forseti-migration
    entrypoint: sh -c "flyway -url=$${FLYWAY_URL} -user=$${FLYWAY_USER} -password=$${FLYWAY_PASSWORD} -connectRetries=60 migrate"
    environment:
      FLYWAY_URL: jdbc:postgresql://floci:7001/forseti
      FLYWAY_USER: forseti
      FLYWAY_PASSWORD: forsetijudge
    depends_on:
      floci:
        condition: service_healthy
    image: flyway/flyway:11.9.2-alpine
    networks:
      - dev-forseti-network
    profiles:
      - core
    volumes:
      - ../../applications/core/src/main/resources/migration:/flyway/sql

  core:
    build:
      context: ../../applications/core
      dockerfile: Dockerfile
    container_name: dev-forseti-core
    depends_on:
      floci:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: development
      VERSION: latest
      AWS_REGION: us-east-1
      AWS_ENDPOINT: http://floci:4566
      AWS_ACCESS_KEY_ID: forsetijudge
      AWS_SECRET_ACCESS_KEY: forsetijudge
      AWS_S3_ENDPOINT_OVERRIDE: http://localhost:4566
      AWS_S3_BUCKET: dev-core-bucket
      AWS_S3_SIGNED_DOWNLOAD_URL_EXPIRATION_SECONDS: 3600
      AWS_S3_SIGNED_UPLOAD_URL_EXPIRATION_SECONDS: 3600
      AWS_SQS_SUBMISSION_QUEUE_URL: http://floci:4566/queue/us-east-1/000000000000/dev-submission-queue
      AWS_SQS_SUBMISSION_FAILED_QUEUE_URL: http://floci:4566/queue/us-east-1/000000000000/dev-submission-failed-queue
      AWS_SQS_SUBMISSION_JUDGED_QUEUE_URL: http://floci:4566/queue/us-east-1/000000000000/dev-submission-judged-queue
      AWS_SQS_AUTO_FREEZE_QUEUE_URL: http://floci:4566/queue/us-east-1/000000000000/dev-auto-freeze-queue
      AWS_SQS_AUTO_FREEZE_QUEUE_ARN: arn:aws:sqs:us-east-1:000000000000:dev-auto-freeze-queue
      AWS_AUTO_FREEZE_SCHEDULER_ROLE_ARN: arn:aws:iam::000000000000:role/dev-auto-freeze-scheduler-role
      DB_URL: jdbc:postgresql://floci:7001/forseti
      DB_USER: forseti
      DB_PASSWORD: forsetijudge
      REDIS_HOST: floci
      REDIS_PORT: 6379
      REDIS_SSE_TTL_SECONDS: 600
      OTEL_SDK_DISABLED: true
      COOKIE_DOMAIN: "*"
      COOKIE_SECURE: false
      ALLOWED_ORIGINS: http://localhost:3000
      SESSION_EXPIRATION_SECONDS: 86400
      SESSION_ROOT_EXPIRATION_SECONDS: 86400
      API_PORT: 8080
    healthcheck:
      test:
        ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health"]
      timeout: 5s
      interval: 15s
      retries: 5
      start_period: 5s
    image: forseti-core:latest
    networks:
      - dev-forseti-network
    ports:
      - 8080:8080
    profiles:
      - core

  autojudge:
    build:
      context: ../../applications/autojudge
      dockerfile: Dockerfile
    container_name: dev-forseti-autojudge
    depends_on:
      floci:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      VERSION: latest
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://floci:4566
      AWS_ACCESS_KEY_ID: forsetijudge
      AWS_SECRET_ACCESS_KEY: forsetijudge
      AWS_S3_BUCKET: dev-core-bucket
      AWS_SQS_SUBMISSION_QUEUE: dev-submission-queue
      AWS_SQS_SUBMISSION_JUDGED_QUEUE: dev-submission-judged-queue
      PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/health"]
      timeout: 5s
      interval: 15s
      retries: 5
      start_period: 5s
    image: forseti-autojudge:latest
    networks:
      - dev-forseti-network
    ports:
      - 8081:8081
    profiles:
      - autojudge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp

  webapp:
    container_name: dev-forseti-webapp
    build:
      context: ../../applications/webapp
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
    environment:
      VERSION: latest
      API_URL: http://localhost:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost"]
      timeout: 5s
      interval: 15s
      retries: 5
      start_period: 5s
    image: forseti-webapp:latest
    networks:
      - dev-forseti-network
    ports:
      - 3000:80
    profiles:
      - webapp

networks:
  dev-forseti-network:
    driver: bridge

volumes:
  dev-floci_data:

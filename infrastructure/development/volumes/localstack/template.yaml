AWSTemplateFormatVersion: "2010-09-09"
Description: Forseti Infrastructure setup for local development using LocalStack

Resources:
  # --- S3 ---
  CoreS3Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: dev-forseti-core-bucket

  # --- S3 Policies ---
  CoreS3BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CoreS3Bucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "s3:*"
            Resource: !Sub "${CoreS3Bucket.Arn}/*"

  # --- SQS ---
  CoreSubmissionFailedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dev-forseti-core-submission-failed-queue

  CoreSubmissionJudgedQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dev-forseti-core-submission-judged-queue

  JudgeSubmissionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: dev-forseti-judge-submission-queue

  # --- SQS Policies ---
  CoreSubmissionFailedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CoreSubmissionFailedQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt CoreSubmissionFailedQueue.Arn

  CoreSubmissionJudgedQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref CoreSubmissionJudgedQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt CoreSubmissionJudgedQueue.Arn

  JudgeSubmissionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref JudgeSubmissionQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: "sqs:*"
            Resource: !GetAtt JudgeSubmissionQueue.Arn
